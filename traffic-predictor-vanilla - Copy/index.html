<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>🚦 Traffic Predictor</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
</head>
<body>
  <div class="card">
    <h1>🚦 Traffic Predictor</h1>
    <form id="traffic-form">
      <input type="text" id="source" placeholder="Source (e.g. Downtown)" required />
      <input type="text" id="destination" placeholder="Destination (e.g. Airport)" required />

      <!-- Updated Time Picker Input -->
      <label for="time">Select Time</label>
      <input type="time" id="time" required />

      <input type="text" id="weather" placeholder="Weather (e.g. Rainy)" required />
      <button type="submit">Predict Traffic</button>
    </form>
    <!-- Updated link for the 'Details' page -->
    <a href="trend.html" id="details-link" target="_blank">🔍 Details</a>
    <div id="result"></div>
  </div>

  <script src="script.js"></script>
</body>
</html>
